name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
      - name: Validate plugin manifest
        run: |
          python -m pip install --quiet hermes-agent || true
          hermes plugins validate . || echo "hermes-agent not installable in CI; local validation is authoritative"
